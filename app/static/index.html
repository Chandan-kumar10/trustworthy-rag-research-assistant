<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Assistant</title>
<script>
(function(){try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})();
</script>

<style>
:root{
  --bg:#ffffff;--panel:#f0f4f9;--fg:#1f1f1f;--muted:#5f6368;--faint:#80868b;
  --line:#dde3ea;--soft:#f0f4f9;--hover:#e3e9f1;--inv-bg:#0b57d0;--inv-fg:#ffffff;
  --accent-soft:#d3e3fd;--shadow:0 6px 24px rgba(31,56,99,.14);--r:16px
}
[data-theme=dark]{
  --bg:#131314;--panel:#1e1f20;--fg:#e3e3e3;--muted:#a8abb0;--faint:#80868b;
  --line:#333537;--soft:#1e1f20;--hover:#2a2b2d;--inv-bg:#a8c7fa;--inv-fg:#062e6f;
  --accent-soft:#1f3a5f;--shadow:0 6px 24px rgba(0,0,0,.55)
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14.5px/1.65 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* ===== Sidebar ===== */
aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .3s cubic-bezier(.4,0,.2,1),transform .3s cubic-bezier(.4,0,.2,1)}
body.collapsed aside{margin-left:-290px}
.side-head{padding:16px 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;flex-shrink:0}
.brand b{display:block;font-size:14.5px;letter-spacing:-.2px;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.side-actions{padding:6px 16px 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);transition:.15s}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.btn.primary:hover{opacity:.88}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{padding:8px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-color:var(--fg);font-weight:600}
.pane{flex:1;overflow-y:auto;padding:14px 12px;display:none}
.pane.on{display:block}
.group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin:6px 8px 6px}
.row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:13.5px;cursor:pointer;transition:background .15s;position:relative}
.row:hover,.row.on{background:var(--hover)}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--faint);font-size:11px}
.row .x{opacity:0;color:var(--muted);padding:3px;border-radius:6px;transition:.15s}
.row:hover .x{opacity:1}
.row .x:hover{color:var(--fg);background:var(--line)}
.note{font-size:12.5px;color:var(--muted);padding:6px 10px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px 12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:.2s;margin-bottom:14px;background:var(--bg)}
.drop:hover{border-color:var(--fg);color:var(--fg)}
.drop .i{width:22px;height:22px;margin-bottom:6px}
.drop small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:-4px 0 12px;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:35%;background:var(--inv-bg);border-radius:3px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}

/* ===== Main ===== */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.title{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.switch{width:54px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--soft);position:relative;transition:.3s;flex-shrink:0}
.switch:hover{border-color:var(--fg)}
.knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;transition:transform .35s cubic-bezier(.4,0,.2,1)}
[data-theme=dark] .knob{transform:translateX(24px)}
.knob .i{width:13px;height:13px;position:absolute;transition:.3s}
.knob .sun{opacity:1;transform:rotate(0)}.knob .moon{opacity:0;transform:rotate(-90deg)}
[data-theme=dark] .knob .sun{opacity:0;transform:rotate(90deg)}
[data-theme=dark] .knob .moon{opacity:1;transform:rotate(0)}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:28px 20px 12px}

/* hero */
.hero{text-align:center;padding-top:9vh}
.hero .logo{width:52px;height:52px;border-radius:15px;margin:0 auto 18px}
.hero .logo .i{width:26px;height:26px}
.hero h1{font-size:30px;letter-spacing:-.8px;margin:0 0 8px}
.hero p{color:var(--muted);max-width:480px;margin:0 auto 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;text-align:left}
.card{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--bg);transition:.2s;display:block;width:100%}
.card:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:var(--shadow)}
.card b{display:block;font-size:13px;margin-bottom:2px}
.card span{font-size:12.5px;color:var(--muted)}

/* messages */
.msg{margin-bottom:28px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--inv-bg);color:var(--inv-fg);padding:10px 15px;border-radius:18px 18px 4px 18px;max-width:82%;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{display:flex;gap:12px}
.avatar{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;background:var(--panel)}
.body{flex:1;min-width:0}
.text p{margin:0 0 10px}.text p:last-child{margin:0}
.text ul,.text ol{margin:0 0 10px;padding-left:22px}
.text li{margin-bottom:4px}
.text code{background:var(--soft);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:12.5px}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border:1px solid var(--line);background:var(--soft);border-radius:6px;font-size:11px;font-weight:600;margin:0 1px;vertical-align:1px;transition:.15s}
.cite:hover{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.notice{display:flex;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--soft)}
.notice .i{margin-top:3px;color:var(--muted)}
.notice b{display:block}.notice span{color:var(--muted);font-size:13px}
.err .notice{border-color:var(--fg)}
.think{display:flex;align-items:center;gap:10px;color:var(--muted)}
.shim{background:linear-gradient(90deg,var(--muted) 0%,var(--fg) 50%,var(--muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-right:3px;animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}

.meta{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.bar{width:44px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--inv-bg);border-radius:4px}
.sources{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.src{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;transition:.15s;width:100%;background:var(--bg)}
.src:hover{border-color:var(--fg);background:var(--soft)}
.src .n{width:22px;height:22px;border-radius:7px;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.src .info{flex:1;min-width:0}
.src .info b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .info span{font-size:11.5px;color:var(--muted)}
.actions{display:flex;gap:2px;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:5px 9px;border-radius:8px;transition:.15s}
.act:hover{background:var(--hover);color:var(--fg)}

/* composer */
.composer{padding:6px 20px 14px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.box{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 2px 14px rgba(0,0,0,.04);transition:.2s}
.box:focus-within{border-color:var(--fg);box-shadow:var(--shadow)}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:inherit;padding:14px 16px 4px;max-height:180px;display:block}
textarea::placeholder{color:var(--faint)}
.bar2{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px 10px;gap:8px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:2px;border:1px solid var(--line)}
.seg button{padding:4px 11px;font-size:12px;border-radius:7px;color:var(--muted);transition:.15s}
.seg button.on{background:var(--inv-bg);color:var(--inv-fg)}
#send{width:34px;height:34px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;transition:.15s}
#send:hover:not(:disabled){transform:scale(1.07)}
#send:disabled{opacity:.25;cursor:not-allowed}
.foot{text-align:center;font-size:11.5px;color:var(--faint);margin-top:8px}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.d-body{padding:18px;overflow-y:auto;flex:1}
.d-body h3{margin:0 0 6px;font-size:16px;line-height:1.4;letter-spacing:-.2px}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.d-pass{border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:14px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
.d-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);margin:0 0 8px}
.d-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;border-bottom:1px solid var(--line)}
.d-link:hover{border-color:var(--fg)}

/* overlays */
#dropall{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);z-index:60;display:none;align-items:center;justify-content:center;text-align:center}
#dropall.on{display:flex}
#dropall div{border:2px dashed var(--fg);border-radius:20px;padding:50px 70px;font-size:18px;font-weight:600}
#toasts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;align-items:center}
.toast{background:var(--inv-bg);color:var(--inv-fg);padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);animation:rise .25s ease}
#veil{display:none}

@media(max-width:860px){
  aside{position:fixed;z-index:30;inset:0 auto 0 0;transform:translateX(-100%);margin-left:0!important;box-shadow:var(--shadow)}
  body.mopen aside{transform:none}
  body.mopen #veil{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  .hero{padding-top:4vh}.hero h1{font-size:25px}
}

/* ===== Gemini-style polish ===== */
aside{border-right:0}
.logo{background:linear-gradient(135deg,#4285f4,#9b72cb);color:#fff}
.btn.primary{border-radius:999px;padding:11px 16px}
.btn{background:transparent}
.row{border-radius:999px;padding:9px 14px}
.row.on{background:var(--accent-soft);color:var(--fg)}
.tab.on{border-color:var(--inv-bg);color:var(--inv-bg)}
.drop{background:var(--bg);border-color:#b6c5db;border-radius:20px}
.drop:hover{border-color:var(--inv-bg);color:var(--inv-bg)}
.top{border-bottom:0;background:var(--bg)}
.switch{background:var(--soft);border-color:transparent}
.switch:hover{border-color:var(--inv-bg)}

.hero h1{font-size:40px;font-weight:600;letter-spacing:-1px;background:linear-gradient(90deg,#4285f4 0%,#9b72cb 50%,#d96570 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.hero p{font-size:15.5px}
.hero .logo{box-shadow:0 8px 24px rgba(66,133,244,.3)}
.card{background:var(--soft);border-color:transparent;border-radius:18px;padding:16px}
.card:hover{background:var(--hover);border-color:transparent;transform:translateY(-3px)}

.bubble{background:#e9eef6;color:#1f1f1f;border-radius:22px 22px 6px 22px}
[data-theme=dark] .bubble{background:#28292a;color:#e3e3e3}
.avatar{background:linear-gradient(135deg,#4285f4,#9b72cb);border:0;color:#fff}
.cite{background:var(--accent-soft);border-color:transparent;color:var(--inv-bg)}
.cite:hover{background:var(--inv-bg);color:var(--inv-fg)}
.pill{background:var(--soft);border-color:transparent}
.src{background:var(--soft);border-color:transparent;border-radius:14px}
.src:hover{background:var(--hover);border-color:transparent}
.notice{background:var(--soft);border-color:transparent;border-radius:16px}
.err .notice{border:1px solid #d93025}
.err .notice .i{color:#d93025}
.act:hover{background:var(--accent-soft);color:var(--inv-bg)}

.composer{background:linear-gradient(to top,var(--bg) 75%,transparent)}
.box{border-radius:28px;background:var(--soft);border:1px solid transparent;box-shadow:none}
.box:focus-within{background:var(--bg);border-color:var(--inv-bg);box-shadow:var(--shadow)}
.seg{background:var(--bg);border-color:var(--line);border-radius:999px}
.seg button{border-radius:999px}
#send{background:var(--inv-bg);color:var(--inv-fg)}
.d-pass{background:var(--soft);border-color:transparent;border-radius:16px}
.toast{background:#1f1f1f;color:#fff}
[data-theme=dark] .toast{background:#e3e3e3;color:#1f1f1f}

/* ===== Verification ===== */
.verify{margin-top:10px}
.vwrap{border-radius:14px;background:var(--soft)}
.vbar{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
details.vwrap>summary{cursor:pointer;list-style:none}
details.vwrap>summary::-webkit-details-marker{display:none}
.vhint{margin-left:auto;color:var(--inv-bg);font-weight:600}
.vlist{padding:2px 14px 12px;display:flex;flex-direction:column;gap:9px}
.vitem{display:flex;gap:10px;font-size:13px;align-items:flex-start;line-height:1.5}
.vtag{flex-shrink:0;font-size:11px;font-weight:600;border-radius:99px;padding:1px 10px;border:1px solid var(--line);margin-top:1px;white-space:nowrap}
.vtag.supported{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.vtag.partial{background:var(--accent-soft);color:var(--inv-bg);border-color:transparent}
.vtag.unsupported{background:transparent;color:var(--muted)}
.vnote{font-size:11.5px;color:var(--faint);padding-top:4px;line-height:1.5}

mark.ev{background:var(--accent-soft);color:inherit;border-radius:4px;padding:1px 2px;box-shadow:0 0 0 2px var(--accent-soft)}
.d-hl{font-size:12px;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">

<aside>
  <div class="side-head">
    <div class="logo" id="logo"></div>
    <div class="brand"><b>Research Assistant</b><span>Grounded answers with citations</span></div>
  </div>
  <div class="side-actions"><button class="btn primary" id="newChat"></button></div>
  <div class="tabs">
    <button class="tab on" data-pane="paneChats">Chats</button>
    <button class="tab" data-pane="paneLib">Library</button>
  </div>
  <div class="pane on" id="paneChats"><div id="history"></div></div>
  <div class="pane" id="paneLib">
    <div class="drop" id="drop"><div id="upIcon"></div>Drop PDFs or click to upload<small>Text-based PDFs, up to 25 MB</small></div>
    <input type="file" id="file" accept=".pdf,application/pdf" multiple hidden>
    <div class="prog" id="prog"><i></i></div>
    <div class="group-label">Your papers</div>
    <div id="papers"></div>
  </div>
  <div class="side-foot"><span>Ctrl+K new chat</span><span>Ctrl+B sidebar</span></div>
</aside>
<div id="veil"></div>

<main>
  <div class="top">
    <button class="icon-btn" id="toggleSide" title="Toggle sidebar (Ctrl+B)"></button>
    <div class="title" id="title">New chat</div>
    <button class="icon-btn" id="exportBtn" title="Export chat"></button>
    <button class="switch" id="theme" title="Toggle dark / light" aria-label="Toggle theme">
      <span class="knob"><span id="sun"></span><span id="moon"></span></span>
    </button>
  </div>

  <div id="scroll"><div class="col" id="wrap"></div></div>

  <div class="composer">
    <div class="box">
      <textarea id="q" rows="1" placeholder="Ask anything about the papers...  ( / to focus )"></textarea>
      <div class="bar2">
        <div class="seg"><button id="scAll">All papers</button><button id="scMine">My uploads</button></div>
        <button id="send" disabled title="Send"></button>
      </div>
      <select id="mode" title="Answer mode" style="border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);padding:5px 10px;font-size:12px">
  <option value="hybrid">Hybrid</option>
  <option value="papers">Papers only</option>
  <option value="general">General (web)</option>
</select>
    </div>
    <div class="foot">Answers come only from indexed papers. Verify citations before relying on them.</div>
  </div>
</main>

<aside id="drawer" style="width:440px;border-right:0;margin:0">
  <div class="d-head"><span id="dTitle">Source</span><button class="icon-btn" id="dClose"></button></div>
  <div class="d-body" id="dBody"></div>
</aside>
</div>

<div id="dropall"><div>Drop PDFs to add them to your library</div></div>
<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const P = {
  logo:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  side:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',

  redo:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',

};
const ico = (n, s) => `<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${P[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* static icons */

$('#newChat').innerHTML = ico('plus') + 'New chat';
$('#toggleSide').innerHTML = ico('side',18);
$('#exportBtn').innerHTML = ico('dl',17);
$('#sun').innerHTML = ico('sun'); $('#sun').firstChild.classList.add('sun');
$('#moon').innerHTML = ico('moon'); $('#moon').firstChild.classList.add('moon');
$('#send').innerHTML = ico('send',17);

$('#sun').style.display = $('#moon').style.display = 'contents';

let convs = store.get('convs', []);
convs.forEach(c => c.msgs.forEach(m => m.verifying = false));
let scope = store.get('scope', 'all');
let cur = null, busy = false, uploads = [];
const scrollDown = () => { const s = $('#scroll'); s.scrollTop = s.scrollHeight };

/* toast */
function toast(t){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  $('#toasts').appendChild(d); setTimeout(() => { d.style.opacity = 0; d.style.transition = '.3s'; setTimeout(() => d.remove(), 300) }, 2600);

/* sidebar */
const isMobile = () => matchMedia('(max-width:860px)').matches;
function toggleSide(){
  if(isMobile()) document.body.classList.toggle('mopen');
  else { document.body.classList.toggle('collapsed'); store.set('collapsed', document.body.classList.contains('collapsed')) }
}
$('#toggleSide').onclick = toggleSide;

/* scope */
function setScope(s){

  $('#scMine').classList.toggle('on', s === 'mine');
}
$('#scAll').onclick = () => setScope('all');
$('#scMine').onclick = () => setScope('mine');

$('#mode').value = mode;
$('#mode').onchange = e => { mode = e.target.value; store.set('mode', mode) };

/* ===== library ===== */
async function loadPapers(){
  try{ uploads = (await (await fetch('/api/papers')).json()).papers || [] }catch(e){ uploads = [] }
  const box = $('#papers'); box.innerHTML = '';
  if(!uploads.length){ box.innerHTML = '<div class="note">No uploads yet. Drop a PDF above.</div>'; return }
  uploads.forEach(p => {
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `${ico('file')}<span class="t" title="${esc(p.title)}">${esc(p.title)}</span><span class="m">${p.chunks}</span><button class="x" title="Remove">${ico('x',14)}</button>`;
    d.querySelector('.x').onclick = async e => {
      e.stopPropagation();
      if(!confirm('Remove "' + p.title + '" from your library?')) return;
      await fetch('/api/papers/' + p.paper_id, {method:'DELETE'});
      toast('Paper removed'); loadPapers();
    };
    box.appendChild(d);
  });
}
async function upload(files){
  files = [...files].filter(f => f.name.toLowerCase().endsWith('.pdf'));
  if(!files.length){ toast('Only PDF files are supported'); return }
  $$('.tab')[1].click();
  $('#prog').classList.add('on'); toast('Indexing ' + files.length + ' file(s)... this can take a minute');
  const fd = new FormData(); files.forEach(f => fd.append('files', f));
  try{
    const d = await (await fetch('/api/upload', {method:'POST', body:fd})).json();
    const ok = d.results.filter(x => x.ok).length, bad = d.results.filter(x => !x.ok);
    if(ok){ toast(ok + ' paper(s) added'); setScope('mine') }
    bad.forEach(b => toast(b.filename + ': ' + b.error));
    loadPapers();
  }catch(e){ toast('Upload failed. Is the server running?') }
  $('#prog').classList.remove('on');
}
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
fileIn.onchange = () => { upload(fileIn.files); fileIn.value = '' };
let dragN = 0;
addEventListener('dragenter', e => { if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ dragN++; $('#dropall').classList.add('on') } });
addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if(!dragN) $('#dropall').classList.remove('on') });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#dropall').classList.remove('on'); if(e.dataTransfer.files.length) upload(e.dataTransfer.files) });

/* ===== history ===== */
function saveConvs(){ convs = convs.slice(0, 40); store.set('convs', convs) }
function renderHistory(){
  const box = $('#history'); box.innerHTML = '';
  if(!convs.length){ box.innerHTML = '<div class="note">No chats yet. Ask your first question.</div>'; return }
  box.innerHTML = '<div class="group-label">Recent</div>';
  convs.forEach(c => {
    const d = document.createElement('div'); d.className = 'row' + (c === cur ? ' on' : '');
    d.innerHTML = `${ico('chat')}<span class="t">${esc(c.title)}</span><button class="x" title="Delete">${ico('x',14)}</button>`;
    d.onclick = () => { cur = c; renderAll(); document.body.classList.remove('mopen') };
    d.querySelector('.x').onclick = e => {
      e.stopPropagation(); convs = convs.filter(x => x !== c); saveConvs();
      if(cur === c) newChat(); else renderHistory();
    };
    box.appendChild(d);
  });
}
function newChat(){
  cur = {id: Date.now().toString(36), title: 'New chat', msgs: []};
  closeDrawer(); renderAll(); document.body.classList.remove('mopen'); $('#q').focus();
}
$('#newChat').onclick = newChat;

/* ===== rendering ===== */
function md(text, sources){
  const known = new Set(sources.map(s => String(s.n)));
  const tip = n => { const s = sources.find(x => String(x.n) === n); return s ? s.title : '' };
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(\d+)\]/g, (m, n) => known.has(n) ? `<button class="cite" data-n="${n}" title="${esc(tip(n))}">${n}</button>` : m);
  return text.trim().split(/\n{2,}/).map(b => {
    const lines = b.split('\n');
    if(lines.every(l => /^\s*[-*\u2022]\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*\u2022]\s+/, '')) + '</li>').join('') + '</ul>';
    if(lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return '<ol>' + lines.map(l => '<li>' + inline(l.replace(/^\s*\d+[.)]\s+/, '')) + '</li>').join('') + '</ol>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}
function userEl(m){
  const el = document.createElement('div'); el.className = 'msg user';
  el.innerHTML = '<div class="bubble"></div>'; el.firstChild.textContent = m.text; return el;
}
function botEl(){
  const el = document.createElement('div'); el.className = 'msg bot';
  el.innerHTML = `<div class="avatar">${ico('logo',15)}</div><div class="body"><div class="text"></div><div class="meta"></div><div class="verify"></div><div class="sources"></div><div class="actions"></div></div>`;
  return el;
}

function finishBot(el, m, isLast){
  const txt = el.querySelector('.text'), meta = el.querySelector('.meta'), src = el.querySelector('.sources'), act = el.querySelector('.actions');
  el.classList.toggle('err', !!m.error);
  const refused = !m.error && m.text.startsWith('Insufficient evidence');
  if(m.error){
    txt.innerHTML = `<div class="notice">${ico('info',18)}<div><b>Something went wrong</b><span>${esc(m.text)}</span></div></div>`;
  }else if(refused){
    txt.innerHTML = `<div class="notice">${ico('info',18)}<div><b>No evidence found</b><span>The indexed papers do not contain enough information to answer this. Try rephrasing, or upload the relevant paper.</span></div></div>`;
  }else{
    txt.innerHTML = md(m.text, m.sources || []);
  }
  meta.innerHTML = ''; src.innerHTML = '';
  const S = m.sources || [];
  if(S.length){
    const papers = new Set(S.map(s => s.title)).size, top = Math.max(...S.map(s => s.score));
    const web = m.kind === 'web';
    meta.innerHTML = web
      ? `<span class="pill">${ico('info',12)} From web search, not from your papers. Verify the links.</span>`
      : `<span class="pill">${ico('check',12)} Grounded in ${S.length} passages from ${papers} paper${papers > 1 ? 's' : ''}</span><span class="pill">Top relevance <span class="bar"><i style="width:${Math.round(top * 100)}%"></i></span> ${top.toFixed(2)}</span>`;    S.forEach(s => {
      const b = document.createElement('button'); b.className = 'src';
      b.innerHTML = `<span class="n">${s.n}</span><span class="info"><b>${esc(s.title)}</b><span>${esc(s.section)} &middot; page ${esc(String(s.page))}</span></span><span class="bar"><i style="width:${Math.round(s.score * 100)}%"></i></span>`;
      b.onclick = () => openDrawer(s);
      src.appendChild(b);
    });
  }

    if(m.kind === 'general'){
    meta.innerHTML = `<span class="pill">${ico('info',12)} General knowledge, not from papers. No sources, please verify.</span>`;
  }
  act.innerHTML = '';
  if(!m.error && !refused){
    const c = document.createElement('button'); c.className = 'act'; c.innerHTML = ico('copy',14) + 'Copy';
    c.onclick = () => navigator.clipboard.writeText(m.text).then(() => { c.innerHTML = ico('check',14) + 'Copied'; setTimeout(() => c.innerHTML = ico('copy',14) + 'Copy', 1400) });
    act.appendChild(c);
  }
  if(isLast){
    const r = document.createElement('button'); r.className = 'act'; r.innerHTML = ico('redo',14) + 'Regenerate';
    r.onclick = regenerate; act.appendChild(r);
  }
    renderVerify(el, m);
  el._sources = S;
    el._m = m;

}
function renderVerify(el, m){
  const box = el.querySelector('.verify'); if(!box) return;
  if(m.kind !== 'grounded'){ box.innerHTML = ''; return }
  if(m.verifying){
    box.innerHTML = `<div class="vwrap"><div class="vbar"><span class="dots"><span></span><span></span><span></span></span><span class="shim">Verifying citations against sources...</span></div></div>`;
    return;
  }
  const v = m.verification;
  if(!v || !v.total){ box.innerHTML = ''; return }
  const pct = Math.round(100 * v.supported / v.total);
  const label = {supported:'Verified', partial:'Partly verified', unsupported:'Could not verify'};
    const claims = v.claims;
  const items = v.claims.map(c => {
   const cites = c.cites.map((n, k) => `<button class="cite" data-n="${n}" data-ci="${k}">${n}</button>`).join('');
    return `<div class="vitem" data-claim="${claims.indexOf(c)}"><span class="vtag ${c.status}">${label[c.status]}</span><span>${esc(c.text)} ${cites}</span></div>`;  }).join('');
  box.innerHTML = `<details class="vwrap"><summary class="vbar">${ico('check',14)}<b>${v.supported} of ${v.total}</b> statements verified<span class="bar"><i style="width:${pct}%"></i></span>${v.partial ? `<span>${v.partial} partly</span>` : ''}${v.unsupported ? `<span>${v.unsupported} could not be verified</span>` : ''}<span class="vhint">Details</span></summary><div class="vlist">${items}<div class="vnote">This is an automatic check. "Could not verify" does not mean the statement is wrong: summarised or multi-source statements are often missed. Open the cited source to confirm.</div></div></details>`;
}
async function startVerify(el, bm){
  if(bm.kind !== 'grounded' || !(bm.sources || []).length) return;
  bm.verifying = true; renderVerify(el, bm);
  try{
    const r = await fetch('/api/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({answer:bm.text, sources:bm.sources})});
    const d = await r.json().catch(() => ({}));
    bm.verification = r.ok ? d.verification : null;
  }catch(e){ bm.verification = null }
  bm.verifying = false; renderVerify(el, bm); saveConvs();
}
function hero(){
  const d = document.createElement('div'); d.className = 'hero';
  d.innerHTML = `<div class="logo">${ico('logo')}</div><h1>What would you like to know?</h1><p>Ask questions about the built-in RAG papers or upload your own PDFs. Every answer is backed by sources you can open and check.</p><div class="cards"></div>`;
  [['How does reranking improve RAG performance?','Retrieval and ranking'],['How should documents be chunked for RAG?','Pipeline design'],['How is RAG evaluated?','Metrics and benchmarks']].forEach(([q, s]) => {
    const b = document.createElement('button'); b.className = 'card'; b.innerHTML = `<b>${esc(q)}</b><span>${s}</span>`;
    b.onclick = () => send(q); d.querySelector('.cards').appendChild(b);
  });
  return d;
}
function renderAll(){
  const w = $('#wrap'); w.innerHTML = '';
  $('#title').textContent = cur.title;
  if(!cur.msgs.length) w.appendChild(hero());
  cur.msgs.forEach((m, i) => {
    if(m.role === 'user') w.appendChild(userEl(m));
    else { const el = botEl(); w.appendChild(el); finishBot(el, m, i === cur.msgs.length - 1) }
  });
  renderHistory(); $('#scroll').style.scrollBehavior = 'auto'; scrollDown(); $('#scroll').style.scrollBehavior = 'smooth';
}

/* citation click */
$('#wrap').addEventListener('click', e => {
  const b = e.target.closest('.cite'); if(!b) return;
  const msg = b.closest('.msg');
  const s = (msg._sources || []).find(x => String(x.n) === b.dataset.n);
  if(!s) return;
  const item = b.closest('.vitem');
  if(item && msg._m && msg._m.verification){
    const c = msg._m.verification.claims[+item.dataset.claim];
    const ev = c && c.evidence_n === s.n ? c.evidence : '';
    openDrawer(s, ev, c ? c.text : '');
  }else openDrawer(s);
});

/* drawer */
function hlPassage(text, ev){
  if(!ev) return esc(text);
  const norm = s => s.replace(/\s+/g, ' ');
  const t = norm(text), e = norm(ev).trim();
  let i = t.indexOf(e);
  if(i < 0){
    const part = e.slice(0, 60);
    i = part.length > 20 ? t.indexOf(part) : -1;
  }
  if(i < 0) return esc(text);
  return esc(t.slice(0, i)) + '<mark class="ev" id="evmark">' + esc(t.slice(i, i + e.length)) + '</mark>' + esc(t.slice(i + e.length));
}
function openDrawer(s, evidence, claim){
  $('#dTitle').textContent = 'Source [' + s.n + ']';
  const hl = evidence ? hlPassage(s.text, evidence) : esc(s.text);
  const note = (evidence && hl.includes('evmark')) ? `<div class="d-hl"><span class="pill">${ico('check',12)} Highlighted: closest match to the statement</span></div>` : '';
  $('#dBody').innerHTML = `<h3>${esc(s.title)}</h3>
    <div class="kv"><span class="pill">${esc(s.section)}</span><span class="pill">Page ${esc(String(s.page))}</span><span class="pill">Relevance <span class="bar"><i style="width:${Math.round(s.score * 100)}%"></i></span> ${s.score.toFixed(2)}</span></div>
    ${claim ? `<div class="d-label">Statement being checked</div><div class="d-pass" style="margin-bottom:14px">${esc(claim)}</div>` : ''}
    ${note}
    <div class="d-label">Passage used for the answer</div><div class="d-pass">${hl}</div>
    ${s.url ? `<a class="d-link" href="${esc(s.url)}" target="_blank" rel="noopener">Open paper ${ico('ext',13)}</a>` : ''}`;
  $('#drawer').classList.add('open');
  const mk = $('#evmark'); if(mk) setTimeout(() => mk.scrollIntoView({behavior:'smooth', block:'center'}), 380);
}
function closeDrawer(){ $('#drawer').classList.remove('open') }
$('#dClose').onclick = closeDrawer;

/* ===== sending ===== */
const q = $('#q'), sendBtn = $('#send');
const phases = ['Searching papers...', 'Re-ranking passages...', 'Writing answer...'];
function setBusy(b){ busy = b; sendBtn.disabled = b || !q.value.trim() }

async function run(text, pushUser){
  setBusy(true);
  if(!convs.includes(cur)) convs.unshift(cur);
  if(!cur.msgs.length) cur.title = text.slice(0, 48);
  const w = $('#wrap'); const h = w.querySelector('.hero'); if(h) h.remove();
  $('#title').textContent = cur.title;
  $$('.act').forEach(a => { if(a.textContent.includes('Regenerate')) a.remove() });

  if(pushUser){ const um = {role:'user', text}; cur.msgs.push(um); w.appendChild(userEl(um)) }
  const bm = {role:'bot', text:'', sources:[]};
  const el = botEl(); w.appendChild(el);
  let pi = 0; const tx = el.querySelector('.text');
  const paint = () => tx.innerHTML = `<div class="think"><span class="dots"><span></span><span></span><span></span></span><span class="shim">${phases[pi]}</span></div>`;
  paint(); const iv = setInterval(() => { pi = Math.min(pi + 1, phases.length - 1); paint() }, 2600);
  scrollDown();

  try{
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:text, scope, mode})});    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.detail || ('Server error ' + r.status));
    bm.text = d.answer; bm.sources = d.sources || [];
    bm.kind = d.kind;
  }catch(e){
    bm.error = true;
    bm.text = (e.message === 'Failed to fetch') ? 'Cannot reach the server. Is it still running?' : e.message;
  }
  clearInterval(iv);
  cur.msgs.push(bm); saveConvs(); renderHistory();

  const refused = bm.text.startsWith('Insufficient evidence');
  if(bm.error || refused){ finishBot(el, bm, true); setBusy(false); scrollDown(); return }
  let i = 0; const step = Math.max(3, Math.ceil(bm.text.length / 110));
  const t = setInterval(() => {
    i += step; tx.textContent = bm.text.slice(0, i); scrollDown();
    if(i >= bm.text.length){ clearInterval(t); finishBot(el, bm, true); setBusy(false); scrollDown(); startVerify(el, bm) }
  }, 18);
}
function send(text){
  text = (text || '').trim(); if(!text || busy) return;
  q.value = ''; q.style.height = 'auto'; run(text, true);
}
function regenerate(){
  if(busy) return;
  const last = cur.msgs[cur.msgs.length - 1];
  if(!last || last.role !== 'bot') return;
  const prev = cur.msgs[cur.msgs.length - 2]; if(!prev) return;
  cur.msgs.pop(); $('#wrap').lastElementChild.remove();
  run(prev.text, false);
}
sendBtn.onclick = () => send(q.value);
q.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(q.value) } });
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; sendBtn.disabled = busy || !q.value.trim() });

/* export */
$('#exportBtn').onclick = () => {
  if(!cur.msgs.length){ toast('Nothing to export yet'); return }
  let t = '# ' + cur.title + '\n\n';
  cur.msgs.forEach(m => {
    if(m.role === 'user') t += '**Question:** ' + m.text + '\n\n';
    else{
      t += '**Answer:** ' + m.text + '\n\n';
      (m.sources || []).forEach(s => t += `- [${s.n}] ${s.title} (${s.section}, p.${s.page})\n`);
      t += '\n';
    }
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], {type:'text/markdown'}));
  a.download = 'chat.md'; a.click(); toast('Chat exported');
};

/* shortcuts */
addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); newChat() }
  else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b'){ e.preventDefault(); toggleSide() }
  else if(e.key === 'Escape') closeDrawer();
  else if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus() }
});

/* init */
setScope(scope); loadPapers(); newChat();
</script>
